name: CI

# Runs the whole backend suite on every push and PR, against the same
# Postgres + pgvector image docker-compose uses. The database tests are the
# ones that matter most here (hybrid retrieval is Postgres-specific SQL), so
# REQUIRE_TEST_DB makes a broken service container fail the build instead of
# quietly skipping them.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lenny
          POSTGRES_PASSWORD: lenny_dev_password
          POSTGRES_DB: lenny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lenny -d lenny_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://lenny:lenny_dev_password@localhost:5432/lenny_test
      REQUIRE_TEST_DB: "1"
      # The default /data paths are container volumes; on a runner they are
      # not writable.
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
      TRACE_DB_PATH: ${{ github.workspace }}/.cache/traces.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('backend/app/config.py') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Strict on the test code this workflow introduced. The rest of the tree
      # has pre-existing findings that belong in their own cleanup change.
      - name: Lint
        run: ruff check tests/test_api.py tests/test_chat_stream.py tests/test_search_filters.py tests/test_citations.py tests/test_mock_llm.py tests/test_contract_regressions.py tests/test_validation.py tests/test_ingest.py tests/test_cloud_providers.py tests/conftest.py loadtests devtools app/validation app/llm

      - name: Migrations apply to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://lenny:lenny_dev_password@localhost:5432/lenny_test
        run: |
          alembic upgrade head
          alembic downgrade base

      # Coverage is printed in the log and fails the job below the floor in
      # pyproject.toml ([tool.coverage.report] fail_under).
      - name: Tests with coverage
        run: >-
          python -m pytest -q -rs
          --cov=app --cov-report=term --cov-report=xml:${{ runner.temp }}/coverage.xml
          --junitxml=${{ runner.temp }}/junit.xml

      - name: Publish test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-and-coverage
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/coverage.xml
          retention-days: 14

  api-collection:
    name: API collection (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The real API, on a real Postgres seeded with a small fixed corpus, with
    # the model replaced by devtools/mock_llm.py through the ordinary
    # openai_compat provider -- so every chat request runs the actual agent
    # loop and guards, deterministically.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lenny
          POSTGRES_PASSWORD: lenny_dev_password
          POSTGRES_DB: lenny_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lenny -d lenny_api"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://lenny:lenny_dev_password@localhost:5432/lenny_api
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
      TRACE_DB_PATH: ${{ github.workspace }}/.cache/traces.db
      INGEST_ON_STARTUP: "false"
      LLM_PROVIDER: openai_compat
      LLM_BASE_URL: http://127.0.0.1:9999/v1
      LLM_MODEL: mock-model
      LLM_API_KEY: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('backend/app/config.py') }}

      - name: Collection matches its builder
        run: python postman/build_collection.py --check

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrate and seed the fixture corpus
        working-directory: backend
        run: |
          alembic upgrade head
          python -m devtools.seed_fixture

      # Fails the job if what was just loaded isn't fit to search: see
      # backend/app/validation/checks.py. The fixture corpus is 3 episodes.
      - name: Validate the knowledge base
        working-directory: backend
        run: python -m app.validation --expected-episodes 3

      - name: Start the mock LLM and the API
        working-directory: backend
        run: |
          nohup python -m devtools.mock_llm --port 9999 > ${{ runner.temp }}/mock_llm.log 2>&1 &
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ${{ runner.temp }}/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health/deep | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          echo "API never reported ok"; cat ${{ runner.temp }}/api.log; exit 1

      # The first search loads the embedding model into memory. Do that once
      # here, so the collection's response-time limits measure requests, not
      # a one-off model load.
      - name: Warm the embedding model
        run: |
          curl -sf -X POST http://127.0.0.1:8000/api/search \
            -H 'Content-Type: application/json' -d '{"query":"warm up"}' > /dev/null

      - name: Run the collection
        run: |
          npx --yes newman@6 run postman/lenny.postman_collection.json \
            -e postman/local.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export ${{ runner.temp }}/newman/junit.xml

      # Generated requests against every non-LLM operation, each response
      # checked against /openapi.json: no 5xx, only documented status codes,
      # bodies matching their schemas (errors included), invalid input
      # rejected. A fixed seed keeps a failure reproducible.
      - name: Contract tests (Schemathesis)
        run: >-
          schemathesis run http://127.0.0.1:8000/openapi.json
          --experimental=openapi-3.1
          --checks all
          --exclude-path-regex chat
          --hypothesis-max-examples 100
          --hypothesis-seed 1
          --junit-xml ${{ runner.temp }}/schemathesis-junit.xml

      - name: Publish Newman and contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-and-contract
          path: |
            ${{ runner.temp }}/newman/junit.xml
            ${{ runner.temp }}/schemathesis-junit.xml
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/mock_llm.log
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The real UI (production build), real API and real database; only the
    # model is scripted, by devtools/mock_llm.py, so each journey's answer is
    # exact. Same backend setup as the API collection job.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lenny
          POSTGRES_PASSWORD: lenny_dev_password
          POSTGRES_DB: lenny_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lenny -d lenny_e2e"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://lenny:lenny_dev_password@localhost:5432/lenny_e2e
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
      TRACE_DB_PATH: ${{ github.workspace }}/.cache/traces.db
      INGEST_ON_STARTUP: "false"
      LLM_PROVIDER: openai_compat
      LLM_BASE_URL: http://127.0.0.1:9999/v1
      LLM_MODEL: mock-model
      LLM_API_KEY: mock
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('backend/app/config.py') }}

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate, seed, start the mock LLM and the API
        working-directory: backend
        run: |
          alembic upgrade head
          python -m devtools.seed_fixture
          nohup python -m devtools.mock_llm --port 9999 > ${{ runner.temp }}/mock_llm.log 2>&1 &
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ${{ runner.temp }}/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health/deep | grep -q '"status":"ok"' && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health/deep | grep -q '"status":"ok"' || { cat ${{ runner.temp }}/api.log; exit 1; }
          curl -sf -X POST http://127.0.0.1:8000/api/search \
            -H 'Content-Type: application/json' -d '{"query":"warm up"}' > /dev/null

      - name: Install and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Run the journeys
        working-directory: frontend
        run: npx playwright test

      - name: Publish the HTML report and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/junit.xml
          retention-days: 14

      # Traces, screenshots and videos are kept by Playwright only for
      # failing tests (playwright.config.ts), so this uploads only then.
      - name: Publish failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            frontend/test-results/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/mock_llm.log
          retention-days: 14
